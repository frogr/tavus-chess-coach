# One-click deploy: https://render.com/deploy?repo=https://github.com/frogr/tavus-chess-coach
# On first boot the server registers the PAL and tools itself (see server/setup.js).
services:
  - type: web
    name: coach-rook
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass # deploy a commit only after the CI workflow passes on it
    envVars:
      - key: TAVUS_API_KEY
        sync: false # entered in the Render dashboard, never committed
      - key: ACCESS_CODE
        sync: false # visitors need this to start a video session (protects your minutes)
      - key: DATABASE_URL
        sync: false # Postgres for the audit log (e.g. a free Neon database); events are lost on restart without it
      - key: ADMIN_TOKEN
        sync: false # long random value; turns on the audit dashboard at /admin
