<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coach Rook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♜</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/vendor/daily.js"></script>
</head>
<body data-mode="puzzle">
  <header class="topbar">
    <div class="brand"><span class="logo">♜</span> Coach Rook</div>
    <div class="topbar-actions">
      <a class="quiet-link" href="/about">About</a>
      <button id="soundBtn" class="quiet" aria-pressed="true">Sound</button>
      <button id="hoodBtn" class="quiet" aria-expanded="false" aria-controls="hood" hidden>Log</button>
    </div>
  </header>

  <main class="layout">
    <section class="coach-col">
      <!-- One panel, three states: lobby (before a call), connecting, live. -->
      <div id="stage" class="stage" data-state="lobby">
        <form id="lobby" class="lobby">
          <div id="coaches" class="coaches" role="radiogroup" aria-label="Coach" hidden></div>
          <p id="coachStyle" class="muted small coach-style" hidden></p>
          <input id="player" maxlength="40" autocomplete="given-name" placeholder="Your name" aria-label="Your name" />
          <input id="code" type="password" maxlength="60" autocomplete="off" placeholder="Access code" aria-label="Access code" hidden />
          <button id="start" class="primary">Start session</button>
          <p id="lobbyError" class="error" role="alert"></p>
        </form>

        <div class="connecting">
          <div class="spinner" role="status" aria-label="Connecting"></div>
          <button id="cancelCall" class="quiet small">Cancel</button>
        </div>

        <div class="live">
          <video id="coachVideo" class="coach-video" autoplay playsinline muted></video>
          <audio id="coachAudio" autoplay></audio>
          <video id="selfVideo" class="self-video off" autoplay playsinline muted></video>
          <p id="stageNote" class="stage-note" role="status"></p>
          <p id="caption" class="caption" aria-live="polite"></p>
        </div>
      </div>

      <div id="callBar" class="call-bar" hidden>
        <button id="micBtn" class="quiet" aria-pressed="true">Mic</button>
        <button id="camBtn" class="quiet" aria-pressed="true">Camera</button>
        <span id="callTime" class="call-time" title="Time left in this session"></span>
        <button id="stop" class="danger">End session</button>
      </div>

      <!-- The game on the board: moves, evaluation timeline, navigation. -->
      <section id="gamePanel" class="game-panel" hidden>
        <div id="moveList" class="move-list" aria-label="Moves"></div>
        <div id="reviewTools">
          <div class="graph-wrap">
            <svg id="graph" class="graph" viewBox="0 0 600 84" preserveAspectRatio="none" role="img" aria-label="Evaluation through the game"></svg>
            <div id="graphTip" class="graph-tip" hidden></div>
          </div>
          <div class="nav">
            <button id="navStart" class="quiet small" aria-label="Start of game" title="First move (Home)">⏮</button>
            <button id="navPrev" class="quiet small" aria-label="Previous move" title="Previous move (←)">◀</button>
            <button id="navPlay" class="quiet small" aria-label="Play through the game" aria-pressed="false" title="Autoplay (Space)">▶︎ Play</button>
            <button id="navNext" class="quiet small" aria-label="Next move" title="Next move (→)">▶</button>
            <button id="navEnd" class="quiet small" aria-label="End of game" title="Last move (End)">⏭</button>
            <button id="navFlip" class="quiet small" title="Flip board (F)">Flip</button>
          </div>
        </div>
      </section>

      <section id="notebook" class="notebook" hidden>
        <header>
          <h2>Notebook</h2>
          <span id="nbName" class="muted"></span>
        </header>
        <ul id="nbNotes"></ul>
        <details class="nb-key">
          <summary>Notebook key</summary>
          <div class="nb-key-row">
            <code id="nbKey"></code>
            <button id="nbKeyCopy" class="quiet small">Copy</button>
          </div>
          <form id="nbKeyForm">
            <input id="nbKeyInput" placeholder="Paste a key from another device" maxlength="80" autocomplete="off" aria-label="Notebook key from another device" />
            <button class="quiet small">Use key</button>
            <span id="nbKeyError" class="error" role="alert"></span>
          </form>
        </details>
      </section>
    </section>

    <section class="board-col">
      <nav class="tabs" aria-label="Mode">
        <button data-tab="puzzle" class="active">Puzzles</button>
        <button data-tab="play">Play</button>
        <button data-tab="review">Review</button>
      </nav>

      <div class="board-head">
        <div>
          <div class="eyebrow" id="pLevel">&nbsp;</div>
          <h1 id="pTitle">&nbsp;</h1>
        </div>
        <div class="head-right">
          <div class="hud puzzle-only" aria-label="Your puzzle score">
            <span class="stat"><b id="hudRating">800</b> rating <i id="hudDelta" class="delta"></i></span>
            <span class="stat"><b id="hudStreak">0</b> streak</span>
          </div>
          <div class="status" id="status" role="status" aria-live="polite"></div>
        </div>
      </div>

      <form id="gameSetup" class="game-setup play-only">
        <label class="strength" for="strength">Coach strength <output id="strengthOut" for="strength">1500</output></label>
        <input id="strength" type="range" min="0" max="5" step="1" value="2" />
        <div class="ticks" aria-hidden="true"><span>500</span><span>1000</span><span>1500</span><span>2000</span><span>2500</span><span>3000</span></div>
        <div class="controls">
          <label class="inline">Play as
            <select id="gameColor"><option value="random">Random</option><option value="w">White</option><option value="b">Black</option></select>
          </label>
          <button class="primary">Start game</button>
        </div>
      </form>

      <div id="topPlayer" class="player-line" hidden></div>
      <div class="board-wrap">
        <div id="evalbar" class="evalbar" hidden aria-hidden="true"><div class="white" style="height:50%"></div><div class="label"></div></div>
        <div id="board" class="board" aria-label="Chess board. Select a piece, then the square to move it to.">
          <div class="promo" role="group" aria-label="Choose a piece to promote to"><div></div></div>
        </div>
      </div>
      <div id="bottomPlayer" class="player-line" hidden></div>

      <div class="controls puzzle-only">
        <button id="retry" class="quiet">Reset</button>
        <button id="next" class="quiet">Next</button>
        <span class="moves" id="moves"></span>
      </div>

      <div class="play-only play">
        <div id="gameBar" hidden>
          <div class="controls">
            <button id="takeBack" class="quiet">Take back</button>
            <button id="resign" class="quiet">Resign</button>
            <button id="reviewGame" class="quiet" hidden>Review this game</button>
            <button id="newGame" class="quiet" hidden>New game</button>
          </div>
        </div>
      </div>

      <div class="review-only review">
        <div id="reviewResult" hidden>
          <div id="moments" class="moments"></div>
        </div>
        <details id="reviewInput" open>
          <summary>Load a game</summary>
          <textarea id="pgn" rows="4" placeholder="PGN or Lichess link" aria-label="PGN or Lichess link"></textarea>
          <div class="controls">
            <label class="inline">I played
              <select id="side"><option value="w">White</option><option value="b">Black</option></select>
            </label>
            <button id="reviewGo" class="primary">Analyze</button>
            <button class="quiet small" data-sample="legal-trap" data-side="b">Sample: Légal's trap</button>
            <button class="quiet small" data-sample="opera-game" data-side="b">Sample: Opera Game</button>
          </div>
          <div class="history">
            <div id="historyList" class="recent"></div>
            <form id="chesscomForm" class="controls">
              <input id="chesscomUser" maxlength="40" autocomplete="off" placeholder="chess.com username" aria-label="chess.com username" />
              <button class="quiet small">Load recent games</button>
              <span id="chesscomError" class="error" role="alert"></span>
            </form>
          </div>
        </details>
      </div>
    </section>
  </main>

  <!-- Developer view (?debug): tool calls and board events, live. -->
  <aside id="hood" class="hood" hidden aria-label="Log">
    <header>
      <h2>Log</h2>
      <a class="muted small" href="/admin">Admin</a>
      <button id="hoodClose" class="quiet small">Close</button>
    </header>
    <div id="sim" class="sim" hidden>
      <button class="quiet small" data-sim="analyze">analyze</button>
      <button class="quiet small" data-sim="hint">show on board</button>
      <button class="quiet small" data-sim="next">load next</button>
      <button class="quiet small" data-sim="solution">play solution</button>
      <button class="quiet small" data-sim="moment">go to moment 1</button>
      <button class="quiet small" data-sim="line">engine line</button>
      <button class="quiet small" data-sim="game">new game</button>
      <button class="quiet small" data-sim="takeback">take back</button>
      <button class="quiet small" data-sim="reviewgame">review game</button>
    </div>
    <ol id="log" class="log"></ol>
  </aside>

  <script type="module" src="/app.js"></script>
</body>
</html>
